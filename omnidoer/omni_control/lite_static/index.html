<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OmniDoer Lite">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json?v=20260606-lite6">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>OmniDoer Lite</title>
  <link rel="stylesheet" href="/lite.css?v=20260606-lite6">
</head>
<body>
  <div id="boot-screen" class="boot-screen" aria-hidden="true">
    <img src="/icon-192.png" alt="" width="72" height="72">
    <strong>OmniDoer Lite</strong>
    <span>连接控制服务</span>
  </div>
  <header class="topbar">
    <div class="brand"><img src="/icon-192.png" alt="" width="32" height="32"><strong>OmniDoer Lite</strong></div>
    <div id="status" class="status">启动中</div>
  </header>
  <main>
    <section id="pair-card" class="panel">
      <h1>配对</h1>
      <p>输入当前服务器生成的 6 位配对码。设备密钥只保存在此浏览器。</p>
      <div class="row">
        <input id="pair-code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="123456">
        <button id="pair-button" type="button">配对</button>
      </div>
      <small id="pair-note"></small>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>核心审批</h2>
        <button id="refresh-button" type="button">刷新</button>
      </div>
      <div id="requests" class="request-list"></div>
    </section>

    <section class="panel chat-panel">
      <div class="section-head">
        <h2>消息</h2>
        <select id="session-select" aria-label="会话"></select>
      </div>
      <div id="messages" class="messages"></div>
      <pre id="terminal" class="terminal" hidden></pre>
      <form id="chat-form" class="composer">
        <textarea id="chat-input" rows="1" placeholder="发送给 OmniDoer"></textarea>
        <label class="attach-button" title="添加文件">
          <input id="chat-files" type="file" multiple accept="image/*,.pdf,.txt,.md,.json,.zip,.log">
          <span>+</span>
        </label>
        <button id="send-button" type="submit">发送</button>
      </form>
      <div id="selected-files" class="selected-files" hidden></div>
    </section>
  </main>
  <script src="/lite.js?v=20260606-lite6"></script>
</body>
</html>

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnidoer"
version = "0.1.0"
description = "Local-first Codex CLI sidecar runtime for safe web actions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "cryptography>=41",
  "argon2-cffi>=23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "playwright>=1.45",
]

[project.scripts]
omnidoer = "omnidoer.omni_cli.main:main"

[tool.setuptools.packages.find]
include = ["omnidoer*"]

[tool.setuptools.package-data]
"omnidoer.omni_control" = ["static/*"]
